<script>
const screen=document.getElementById("screen");
function fit(){
  const sx=innerWidth/691, sy=innerHeight/1536;
  const s=Math.min(sx,sy);
  screen.style.transform=`scale(${s})`;
}
addEventListener("resize",fit); fit();

const data=[
  ["251.0","07-يوليو-2026","2921632510"],
  ["1001.0","06-يوليو-2026","2918057424"],
  ["301.5","05-يوليو-2026","2916467559"],
  ["301.5","04-يوليو-2026","2914681165"],
  ["301.5","04-يوليو-2026","2914440852"],
  ["301.5","04-يوليو-2026","2914024849"],
  ["4455.0","03-يوليو-2026","2913907461"]
];

const list=document.getElementById("transactions");

function formatDateExact(value){
  const s=String(value||"").trim();
  let day="";
  let year="2026";
  let m=s.match(/^(\d{4})-(?:يوليو|مايو)-(\d{1,2})$/);
  if(m){
    year=m[1];
    day=String(m[3]).padStart(2,"0");
  } else {
    m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(m){
      year=m[1];
      day=m[3];
    } else {
      m=s.match(/(\d{1,2})/);
      day=m ? String(m[1]).padStart(2,"0") : "07";
    }
  }
  return '<span class="date-exact"><bdi dir="ltr">'+year+
         '</bdi><span>-</span><bdi dir="rtl">يوليو</bdi>'+
         '<span>-</span><bdi dir="ltr">'+day+'</bdi></span>';
}

function draw(){
  list.innerHTML=data.map((x,i)=>`
    <div class="tx" data-i="${i}">

/* ===== SIMPLE TEXT/NUMBER EDITING =====
   Keeps the original design/layout untouched. Any normal text or number
   can be clicked, edited in place, and is saved automatically. */
(function(){
  const STORE_KEY = "orangeCashTextEdits_v1";
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  const ignored = new Set([
    "BUTTON", "IMG", "SCRIPT", "STYLE", "INPUT", "TEXTAREA", "SELECT"
  ]);

  function keyFor(el){
    const tx = el.closest(".tx");
    if(tx) return "tx:" + tx.dataset.i + ":" + el.className;
    if(el.id) return "id:" + el.id;
    const cls = typeof el.className === "string" ? el.className : el.tagName;
    const same = [...document.querySelectorAll("#screen ." + cls.split(/\s+/)[0])].indexOf(el);
    return "el:" + cls + ":" + same;
  }

  function makeEditable(el){
    if(!el || ignored.has(el.tagName) || el.isContentEditable) return;
    if(el.closest(".round-btn,.tab,.filter-choice,.filter-close,.share")) return;
    const hasDirectText = [...el.childNodes].some(n => n.nodeType === 3 && n.nodeValue.trim());
    if(!hasDirectText) return;
    el.setAttribute("contenteditable","true");
    el.setAttribute("spellcheck","false");
    el.dataset.editKey = keyFor(el);
    if(Object.prototype.hasOwnProperty.call(saved,el.dataset.editKey)) el.textContent = saved[el.dataset.editKey];

    el.addEventListener("input",()=>{
      saved[el.dataset.editKey] = el.textContent;
      localStorage.setItem(STORE_KEY,JSON.stringify(saved));
    });
    el.addEventListener("keydown",e=>{
      if(e.key === "Enter"){ e.preventDefault(); el.blur(); }
    });
    el.addEventListener("click",e=>{
      e.stopPropagation();
    });
  }

  function scan(){
    document.querySelectorAll("#screen *").forEach(makeEditable);
  }
  scan();
})();


const overlay=document.getElementById("filterOverlay");
const filterChoices=document.querySelectorAll(".filter-choice");
const tabs=document.querySelectorAll(".tab");

function setFilter(name){
  tabs.forEach(t=>t.classList.toggle("active",t.dataset.filter===name));
  filterChoices.forEach(c=>c.classList.toggle("active",c.dataset.filter===name));
  // The supplied reference is showing outgoing transfers. Other states remain
  // interactive and can be populated with their own data later.
  overlay.classList.add("hidden");
}
document.querySelector(".filter-btn").addEventListener("click",()=>{
  overlay.classList.remove("hidden");
});
document.getElementById("closeFilter").addEventListener("click",()=>{
  overlay.classList.add("hidden");
});
overlay.addEventListener("click",e=>{
  if(e.target===overlay) overlay.classList.add("hidden");
});
filterChoices.forEach(c=>c.addEventListener("click",()=>setFilter(c.dataset.filter)));
tabs.forEach(t=>t.addEventListener("click",()=>setFilter(t.dataset.filter)));

  document.getElementById("dDate").innerHTML=formatDateExact(x[1]);
  document.getElementById("dTime").textContent="02:16:17";
  history.classList.add("hidden");
  details.classList.remove("hidden");
  document.getElementById("detailScroll").scrollTop=0;
});

function goToHistory(){
  details.classList.add("hidden");
  history.classList.remove("hidden");
  document.getElementById("detailScroll").scrollTop=0;
  document.querySelector(".history-content").scrollTop=0;
}
document.getElementById("detailBack").addEventListener("click",goToHistory);

document.getElementById("historyBack").addEventListener("click",()=>{
  // The history screen is the root screen in this prototype.
  // If the browser has a previous page, use it; otherwise stay on history.
  if (window.history.length > 1) window.history.back();
});

document.querySelector(".share").onclick=()=>{
  if(navigator.share) navigator.share({title:"تفاصيل العملية",text:"عملية تحويل أموال"});
  else alert("المشاركة");
};

["detailBack","historyBack"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("keydown",e=>{
    if(e.key==="Enter" || e.key===" ") { e.preventDefault(); el.click(); }
  });
});

</script>
</body>
</html>
